name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: make test
        run: |
          make test
      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: docker login for dhi.io
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKER_HUB_OIDC_CONNECTION_ID }}
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
      - name: Build docker image
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: score-implementation-sample:test
          build-args: |
            "VERSION=test"
      - name: make test-app
        run: |
          make test-app
      - name: make test-container
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          make test-container
